<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart Checkpoint</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f6f9;
        margin: 0;
        padding: 20px;
        color: #333;
      }
      .cart-container {
        max-width: 600px;
        margin: 0 auto;
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }
      h1 {
        text-align: center;
        color: #2c3e50;
      }
      .cart-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 15px 0;
        border-bottom: 1px solid #eee;
      }
      .item-details {
        flex: 2;
      }
      .item-name {
        font-weight: bold;
        font-size: 1.1rem;
      }
      .unit-price {
        color: #7f8c8d;
        font-size: 0.9rem;
      }
      .quantity-controls {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1;
        justify-content: center;
      }
      .btn-qty {
        background-color: #3498db;
        color: white;
        border: none;
        width: 30px;
        height: 30px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 1.2rem;
        font-weight: bold;
      }
      .btn-qty:hover {
        background-color: #2980b9;
      }
      .qte {
        font-size: 1.1rem;
        font-weight: bold;
        min-width: 20px;
        text-align: center;
      }
      .actions {
        display: flex;
        gap: 15px;
        align-items: center;
        flex: 1;
        justify-content: flex-end;
      }
      .btn-like {
        background: none;
        border: none;
        font-size: 1.5rem;
        cursor: pointer;
        color: #ccc;
        transition: color 0.2s;
      }
      .btn-delete {
        background-color: #e74c3c;
        color: white;
        border: none;
        padding: 6px 10px;
        border-radius: 4px;
        cursor: pointer;
      }
      .btn-delete:hover {
        background-color: #c0392b;
      }
      .cart-summary {
        margin-top: 20px;
        text-align: right;
        font-size: 1.3rem;
        font-weight: bold;
        border-top: 2px solid #2c3e50;
        padding-top: 15px;
      }
      .total-price {
        color: #27ae60;
      }
    </style>
  </head>
  <body>
    <div class="cart-container">
      <h1>Shopping Cart</h1>

      <!-- Item 1 -->
      <div class="cart-item">
        <div class="item-details">
          <div class="item-name">Wireless Headphones</div>
          <div class="unit-price">$50.00</div>
        </div>
        <div class="quantity-controls">
          <button class="btn-qty btn-minus">-</button>
          <span class="qte">1</span>
          <button class="btn-qty btn-plus">+</button>
        </div>
        <div class="actions">
          <button class="btn-like">♥</button>
          <button class="btn-delete">Delete</button>
        </div>
      </div>

      <!-- Item 2 -->
      <div class="cart-item">
        <div class="item-details">
          <div class="item-name">Smart Watch</div>
          <div class="unit-price">$120.00</div>
        </div>
        <div class="quantity-controls">
          <button class="btn-qty btn-minus">-</button>
          <span class="qte">1</span>
          <button class="btn-qty btn-plus">+</button>
        </div>
        <div class="actions">
          <button class="btn-like">♥</button>
          <button class="btn-delete">Delete</button>
        </div>
      </div>

      <!-- Total Summary -->
      <div class="cart-summary">
        Grand Total: <span class="total-price">$0.00</span>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const totalPriceElement = document.querySelector(".total-price");

        function updateCartTotal() {
          let total = 0;
          // Search the page for all live items remaining in the cart
          const cartItems = document.querySelectorAll(".cart-item");

          cartItems.forEach((item) => {
            const priceElement = item.querySelector(".unit-price");
            const quantityElement = item.querySelector(".qte");

            if (priceElement && quantityElement) {
              const unitPrice = parseFloat(
                priceElement.textContent.replace(/[^0-9.]/g, ""),
              );
              const quantity = parseInt(quantityElement.textContent, 10);
              total += unitPrice * quantity;
            }
          });

          if (totalPriceElement) {
            totalPriceElement.textContent = `$${total.toFixed(2)}`;
          }
        }

        // Attach functionality to the whole document to catch events dynamically
        document.body.addEventListener("click", (event) => {
          const target = event.target;
          const itemRow = target.closest(".cart-item");

          if (!itemRow) return; // Ignore clicks outside item rows

          const quantityElement = itemRow.querySelector(".qte");

          // "+" Button logic
          if (target.classList.contains("btn-plus")) {
            let qty = parseInt(quantityElement.textContent, 10);
            quantityElement.textContent = qty + 1;
            updateCartTotal();
          }

          // "-" Button logic
          if (target.classList.contains("btn-minus")) {
            let qty = parseInt(quantityElement.textContent, 10);
            if (qty > 1) {
              quantityElement.textContent = qty - 1;
              updateCartTotal();
            }
          }

          // Delete Button logic
          if (target.classList.contains("btn-delete")) {
            itemRow.remove();
            updateCartTotal();
          }

          // Heart/Like Button logic
          if (target.classList.contains("btn-like")) {
            target.classList.toggle("liked");
            if (target.classList.contains("liked")) {
              target.style.color = "#e74c3c"; // Turn red
            } else {
              target.style.color = "#ccc"; // Turn back to neutral gray
            }
          }
        });

        // Run calculation once at start to display the true initial prices
        updateCartTotal();
      });
    </script>
  </body>
</html>
